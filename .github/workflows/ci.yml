name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-tests:
    name: Python tests (Windows)
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: [3.9, 3.10, 3.11]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path 'requirements.txt') {
            python -m pip install -r requirements.txt
          }
          python -m pip install pytest flake8 bandit
      - name: Lint (flake8)
        continue-on-error: true
        run: python -m flake8
      - name: Security scan (bandit)
        continue-on-error: true
        run: |
          python -m bandit -r . -f xml -o bandit-report.xml
      - name: Run tests
        continue-on-error: true
        run: python -m pytest -q --junitxml=pytest.xml
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-test-results-${{ matrix.python-version }}
          path: |
            ./pytest.xml
            ./bandit-report.xml

  java-build:
    name: Java (Maven) build (Windows)
    runs-on: windows-latest
    strategy:
      matrix:
        java-version: [17]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-
      - name: Build and test (Maven)
        run: mvn -B test
      - name: Upload Maven surefire reports
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-results
          path: target/surefire-reports

  codeql:
    name: CodeQL analysis
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: java, python
      - name: Autobuild
        uses: github/codeql-action/autobuild@v2
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2
